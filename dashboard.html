<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In</title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Yrsa:wght@400;500;700&display=swap" rel="stylesheet">
<style>

body{background-color:#f2eeea}


:root {
      --primary-green: #064e3b; /*green*/
    }
  
  .logout{
    position:fixed;
    top:0;
    right:0;
    font-size:12pt;
    font-family:Inter;
    margin:8px;
    font-weight:500;
    background:transparent;
    border: none;          /* Removes the default stroke/outline */
    border-radius: 8px;    /* Rounds the edges (use 25px for pill shape) */
    cursor: pointer;       /* Makes the mouse turn into a hand on hover */
    color:black;
  }
  
  #main{padding: 0 50px;
  padding-top:50px;}
  
#avatar {
    background: gray;
    border-radius: 10000px;
    aspect-ratio:1/1;
    width: 100px;
    height: 100px;
    
    /* Center the text inside */
    display: flex;           /* Enables flexbox */
    justify-content: center; /* Centers horizontally */
    align-items: center;     /* Centers vertically */
    
    /* Text styling */
    color: white;            /* Makes text readable against gray */
    font-family: Inter;
    font-weight: 700;
    font-size: 1.5rem;
    border: 5px solid white;
}

#user-info{
  font-family: Inter;
  text-transform:uppercase;
  letter-spacing:0.6px;
  padding:0;
  margin:0;
}

#fullname{
  font-family: Yrsa;
  font-weight:500;
  padding:0;
  margin:0;
  font-size:36pt;
}
  
</style>
</head>
<body>
  <div id="main">
        <div style="display:flex;">
      		<div id="avatar">DE</div>
            <div style="padding-left:20px;">
          		<h1 id="fullname">Default Name</h1>
          		<p id="user-info">@default • 0 stamps</p>
          </div>
      </div>
        <hr>
  </div>


        <button class="logout" onclick="handleLogout()">Log Out</button>

    <script src="app.js"></script>
</body>
</html>
