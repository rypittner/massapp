<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login/title>
    <script src="https://cdn.jsdelivr.net/npm/appwrite@13.0.1"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Yrsa:wght@400;500;700&display=swap" rel="stylesheet">
<style>

* {
  box-sizing: border-box;
}

#auth-container, #app-content { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }

input { 
  display: block; 
  margin: 0 auto 12px auto; /* Centers the input and adds bottom spacing */
  padding: 15px; 
  border: 1px solid #ddd; 
  border-radius: 8px;  
  width: 350px; 
  font-family: 'Inter', sans-serif;
  font-size: 1rem;
}

:root {
      --primary-green: #064e3b; /*green*/
    }
h2{
	font-family:Yrsa;
	color:var(--primary-green);
    font-weight:500;
    font-size:2rem;
    margin:0;
    padding:10px;
    padding-bottom:20px;
    justify:center;
}
p{font-family:Inter;
margin-top:0;}
body {
    margin: 0; 
    display: flex;
    justify-content: center; /* Centers horizontally */
    align-items: center;     /* Centers vertically */
    min-height: 100vh;       /* Sets height to 100% of the viewport height */
    background:rgb(0 0 0 / 0.5);
  }
  /* 2. Style the container if needed */
  .center {
    text-align: center;      /* Centers the text and buttons inside the div */
  }
  
  button{
  font-size:12pt;
  font-family:Inter;
  width:350px;
  height:50px;
  margin:8px;
  font-weight:700;
  border: none;          /* Removes the default stroke/outline */
  border-radius: 8px;    /* Rounds the edges (use 25px for pill shape) */
  cursor: pointer;       /* Makes the mouse turn into a hand on hover */
  	background-color:var(--primary-green);
    color:white;
  }
  
  .solid-button{

  }
  
  .outline-button{
    border: 1px solid var(--primary-green);  
    background-color: transparent;           /* Makes it a true outline button */
  color: var(--primary-green);
  }
</style>
</head>
<body>

    <div id="auth-container">
        <h2>Welcome Back</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <button onclick="handleLogin()">Log In</button>
    </div>

    <div id="app-content" style="display:none;">
        <h2>Welcome to the App!</h2>
        <button onclick="handleLogout()">Log Out</button>
    </div>

    <script src="app.js"></script>
</body>
</html>
